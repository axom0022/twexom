name: Feature request
description: Propose a Twexom capability
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What application problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show an example and describe cleanup, mobile, and reduced-motion behavior.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Where should it live?
      options:
        - Lightweight core
        - Optional module
        - Adapter or tooling
        - Not sure
    validations:
      required: true
